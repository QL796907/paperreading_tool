name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Lockfile tarball URLs point at registry.npmmirror.com. GitHub-hosted
      # runners reach registry.npmjs.org more reliably; integrity hashes stay
      # the same. The web build does not need the Electron binary.
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build
        run: npm run build

      # Suites that execute on this job's Node 20. webdavClient.test.js
      # needs mock.module and is not part of npm test.
      - name: Test
        run: npm test
